name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: node --check server/server.js
      - run: node --check server/auth.js
      - run: node --check server/config.js
      - run: node --check server/provisioning.js
      - run: node --check server/dns.js
      - run: node --check server/cpanel-flow.js
      - run: node --check server/services/integrations.js
      - run: node --check server/services/integration-install.js
